apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ironcore.fullname" . }}-config
  labels:
    {{- include "ironcore.labels" . | nindent 4 }}
data:
  IRONCORE_EDITION: {{ .Values.edition.value | quote }}
  IRONCORE_LOG_LEVEL: "INFO"
  {{- if .Values.airgap.enabled }}
  IRONCORE_AIRGAP_ENABLED: "true"
  IRONCORE_VLLM_BASE_URL: {{ .Values.airgap.vllmBaseUrl | quote }}
  {{- end }}
  {{- if .Values.siem.enabled }}
  IRONCORE_SIEM_TRANSPORTS: {{ .Values.siem.transports | quote }}
  IRONCORE_SIEM_BUFFER_SIZE: {{ .Values.siem.bufferSize | quote }}
  IRONCORE_SIEM_FLUSH_INTERVAL: {{ .Values.siem.flushInterval | quote }}
  {{- if .Values.siem.syslogHost }}
  IRONCORE_SYSLOG_HOST: {{ .Values.siem.syslogHost | quote }}
  IRONCORE_SYSLOG_PORT: {{ .Values.siem.syslogPort | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.sso.enabled }}
  IRONCORE_SSO_PROVIDER: {{ .Values.sso.provider | quote }}
  IRONCORE_SSO_CLIENT_ID: {{ .Values.sso.clientId | quote }}
  IRONCORE_SSO_TENANT_ID: {{ .Values.sso.tenantId | quote }}
  IRONCORE_SSO_REDIRECT_URI: {{ .Values.sso.redirectUri | quote }}
  {{- end }}
