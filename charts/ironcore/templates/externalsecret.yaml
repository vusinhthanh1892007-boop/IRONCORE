{{- if .Values.externalSecrets.enabled }}
# ── LLM API Keys ─────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ironcore.fullname" . }}-llm-secrets
  labels:
    {{- include "ironcore.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: ironcore-llm-secrets
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.vaultMountPath }}/llm
        property: anthropic_api_key
    - secretKey: openai-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.vaultMountPath }}/llm
        property: openai_api_key
---
{{- if .Values.siem.enabled }}
# ── SIEM Secrets ─────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ironcore.fullname" . }}-siem-secrets
  labels:
    {{- include "ironcore.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: ironcore-siem-secrets
    creationPolicy: Owner
  data:
    - secretKey: splunk-hec-token
      remoteRef:
        key: {{ .Values.externalSecrets.vaultMountPath }}/siem
        property: splunk_hec_token
    - secretKey: datadog-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.vaultMountPath }}/siem
        property: datadog_api_key
{{- end }}
---
{{- if .Values.sso.enabled }}
# ── SSO Secrets ───────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ironcore.fullname" . }}-sso-secrets
  labels:
    {{- include "ironcore.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: ironcore-sso-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecrets.vaultMountPath }}/sso
        property: client_secret
{{- end }}
{{- end }}
