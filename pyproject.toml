[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironcore"
version = "0.1.0"
description = "Secure, event-driven AI agent framework with sandboxing and observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "aiofiles>=23.2.1",
  "cryptography>=42.0.0",
  "docker>=7.0.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "litellm>=1.67.0",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0.84",
  "playwright>=1.44.0",
  "pydantic>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "toml>=0.10.2",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]
local-ai = [
  "torch>=2.2.0",
  "transformers>=4.38.0",
  "accelerate>=0.27.0",
  "chromadb>=0.4.22",
  "sentence-transformers>=2.5.1",
]

[tool.setuptools.packages.find]
include = ["ironcore*", "deployment*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ironcore/tests", "tests"]
python_files = ["test_*.py"]
markers = [
  "integration: tests that require Docker or external runtime dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ironcore", "deployment", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["ironcore", "deployment"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests", "ironcore/tests"]
